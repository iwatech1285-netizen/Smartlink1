<!-- 🌟 Adsterra Direct Link + Countdown Download Button -->
<div style="text-align:center;margin:20px auto;padding:15px;max-width:95%;background:#ffffff;border-radius:15px;box-shadow:0 0 10px rgba(0,255,204,0.5);font-family:'Poppins',sans-serif;">

  <a href="https://asiafilm.org/4/4bbe48246de38be3b29e6be0c2708bb5" target="_blank" rel="noopener">
    <img src="https://i.postimg.cc/9MnYVyPm/download.png" alt="Click to Download"
         style="width:90%;max-width:280px;height:auto;border-radius:15px;box-shadow:0 0 15px rgba(0,255,204,0.7);">
  </a>

  <p style="font-size:15px;color:#333;margin-top:10px;line-height:1.4;">
    🎬 Tap the image above to start <b>Full Movie</b>!
  </p>

  <!-- Step 1: opens the ad. Step 2: countdown 1-10. Step 3: same button becomes the real download link -->
  <a id="dlBtn" href="https://asiafilm.org/4/4bbe48246de38be3b29e6be0c2708bb5" target="_blank" rel="noopener"
     style="display:inline-block;margin-top:15px;padding:12px 25px;font-size:16px;font-weight:600;color:#fff;text-decoration:none;background:linear-gradient(45deg,#00ffcc,#0066ff);border-radius:50px;box-shadow:0 0 15px rgba(0,255,204,0.7);">
    ▶ Download Now
  </a>
</div>

<script>
(function () {
  var btn = document.getElementById('dlBtn');
  var adLink = btn.href;
  var finalLink = 'https://www.getmodsapk.cc/capcut/';
  var started = false;

  btn.addEventListener('click', function (e) {
    if (started) return;            // during countdown: do nothing
    if (btn.getAttribute('data-ready') === '1') return; // ready: let link work normally
    started = true;                 // first click: ad opens in new tab (default action)
    var n = 1;
    btn.textContent = 'Please wait... ' + n + ' / 10';
    btn.style.opacity = '0.7';
    btn.style.pointerEvents = 'none';
    var t = setInterval(function () {
      n++;
      if (n <= 10) {
        btn.textContent = 'Please wait... ' + n + ' / 10';
      } else {
        clearInterval(t);
        btn.href = finalLink;
        btn.setAttribute('data-ready', '1');
        btn.textContent = '⬇ Download Now';
        btn.style.opacity = '1';
        btn.style.pointerEvents = 'auto';
        started = false;
      }
    }, 1000);
  });
})();
</script>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
